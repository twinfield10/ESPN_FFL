# config.example.yaml
#
# Copy to config.yaml and fill in your own values. config.yaml is gitignored
# and must never be committed -- it holds live ESPN session cookies.
#
# Finding your ESPN credentials:
#   1. Log in to fantasy.espn.com in a browser.
#   2. Open DevTools -> Application -> Cookies -> https://fantasy.espn.com
#   3. Copy the values of the `espn_s2` and `SWID` cookies.
#   4. `espn_s2` must be URL-encoded exactly as the cookie stores it.
#      `SWID` includes the surrounding braces, e.g. '{ABCDEF12-...}'.
# These expire periodically; a sudden ESPNAccessDenied usually means refresh them.
#
# Private leagues need credentials belonging to a member of that league, which
# is why leagues owned by other people carry their own pair below.

# Season the pipeline operates on. Bump this once per year; it drives every
# league's default year and the season-scoped data directories.
season: 2026

credentials:
  # Shared fallback pair, used by any league that does not define its own.
  espn_id: 'YOUR_URL_ENCODED_ESPN_S2_COOKIE'
  s_id: '{YOUR-SWID-COOKIE-WITH-BRACES}'

leagues:
  # `display_name` is the key used everywhere downstream, and must match the
  # Google Sheet name exactly -- write_to_google() calls client.open() with it.
  example_league:
    id: 123456
    display_name: 'Example_League'
    start: 2020            # earliest season with data on ESPN
    end: 2026              # season to pull; normally matches `season` above
    primary_owner: 'Your Name'
    # Omit espn_s2/swid to inherit the shared `credentials` pair above.

  example_other_owners_league:
    id: 654321
    display_name: 'Someone Elses League'
    start: 2024
    end: 2026
    primary_owner: 'League Member Name'
    # A league you are not a member of needs that member's own cookies:
    espn_s2: 'THEIR_URL_ENCODED_ESPN_S2_COOKIE'
    swid: '{THEIR-SWID-COOKIE}'

# FantasyPros session, for the projections scrape. OPTIONAL but strongly recommended.
#
# Without it, FantasyPros serves ten rows per position behind a registration fence --
# 60 players total, which is a tenth of what the blend should see. A **free** account
# (tier `basic`) lifts it to 592, and takes D/ST from ten teams to all thirty-two.
#
# To get it: log in at fantasypros.com, then DevTools -> Application -> Cookies ->
# https://www.fantasypros.com. The ones that matter are `sessionid`, `fptoken`,
# `fp_userdata`, `fp_level` and `fp_launchpad`, plus a randomised-name duplicate of
# `sessionid`. Easiest is Network tab -> the projections request -> Request Headers ->
# copy the whole `Cookie:` value; Scripts/scrape_FP.py ignores what it does not need.
#
# Use a `|-` block scalar, NOT a quoted string: some cookie values contain double
# quotes (connectId is JSON) and will break a YAML double-quoted scalar.
#
# This is a live credential and expires -- the 2026 session runs to 22 November, mid
# season. run_daily_refresh.sh fails loudly if the scrape drops back to <=60 rows,
# which is what an expired cookie looks like.
fantasypros:
  cookie: |-
    sessionid=...; fptoken=...; fp_userdata=...; fp_level=...; fp_launchpad=login
